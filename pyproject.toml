[project]
name = "dev-agents"
version = "0.1.0"
description = "Research and coding agents for Python, YAML, and Rust"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{name = "Steve Fulmer", email = "sfulmer@redhat.com"}]
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
dev-agents = "dev_agents.__main__:main"

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_agents"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
